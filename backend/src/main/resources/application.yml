server:
  port: 8080
spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    connection-timeout: 3s
    username: ${SPRING_RABBITMQ_USERNAME:cae}
    password: ${SPRING_RABBITMQ_PASSWORD:demo-cae-password}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:${RABBITMQ_VHOST:/}}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 8
        concurrency: 2
        max-concurrency: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cae?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:cae}
    password: ${DB_PASSWORD:demo-cae-password}
    hikari:
      maximum-pool-size: 16
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
cae:
  mq:
    listeners-enabled: ${CAE_MQ_LISTENERS_ENABLED:true}
  background:
    enabled: ${CAE_BACKGROUND_ENABLED:true}
  monitor:
    scan-ms: ${CAE_MONITOR_SCAN_MS:5000}
    poll-ms: ${CAE_MONITOR_POLL_MS:5000}
    lease-ms: ${CAE_MONITOR_LEASE_MS:15000}
  nodes:
    suspect-seconds: 10
    offline-seconds: 20
    refresh-ms: 5000
  scheduler:
    scan-ms: 1000
    weights:
      priority: 1.0
      waiting-seconds: 0.02
      free-cpu: 20.0
      free-memory: 20.0
      running-penalty: 5.0
